<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoBox Sky Editor</title>
<script type="importmap">
{
	"imports": {
		"three": "./node_modules/three/build/three.module.js",
		"three/addons/": "./node_modules/three/examples/jsm/",
		"lil-gui": "./node_modules/lil-gui/dist/lil-gui.esm.js"
	}
}
</script>
<style>
	:root {
		--bg: #0f1216; --panel: rgba(18, 22, 28, 0.88); --line: rgba(255,255,255,0.12);
		--text: #e7ecf2; --muted: #9aa6b4; --accent: #5aa9ff; --ok: #6fd08c; --warn: #ffc163;
		font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
	}
	html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
	#view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; cursor: grab; }
	#view:active { cursor: grabbing; }
	.panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
		backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0,0,0,0.35); }
	#topbar { top: 10px; left: 10px; padding: 8px 12px; display: flex; gap: 12px; align-items: center; font-size: 13px; }
	#topbar b { font-size: 14px; letter-spacing: .02em; }
	#topbar .muted { color: var(--muted); }
	#topbar button, #refPanel button { background: #243041; color: var(--text); border: 1px solid var(--line);
		border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
	#topbar button:hover, #refPanel button:hover { border-color: var(--accent); }
	#refPanel { top: 56px; left: 10px; width: 300px; max-height: calc(100% - 120px); overflow: auto; padding: 10px 12px; font-size: 12px; }
	#refPanel h3 { margin: 4px 0 8px; font-size: 13px; }
	#drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 14px 8px; text-align: center; color: var(--muted); cursor: pointer; }
	#drop.over { border-color: var(--accent); color: var(--text); }
	.thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
	.thumbs figure { margin: 0; }
	.thumbs canvas { width: 100%; border-radius: 4px; background: #000; display: block; }
	.thumbs figcaption { color: var(--muted); font-size: 11px; margin-top: 2px; }
	.row { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
	.row label { flex: 0 0 96px; color: var(--muted); }
	.row input[type=range] { flex: 1; }
	.row input[type=number] { width: 64px; background: #10151c; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
	.row .val { width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
	.btns { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
	button.primary { background: #1d4f8a !important; border-color: #2d6fbe !important; }
	pre#stats { white-space: pre-wrap; background: #0c1015; border-radius: 6px; padding: 6px; color: #c8d3df; font-size: 11px; max-height: 220px; overflow: auto; margin: 6px 0 0; }
	#status { position: fixed; left: 10px; bottom: 10px; padding: 6px 10px; font-size: 12px; color: var(--muted); }
	#status.ok { color: var(--ok); } #status.warn { color: var(--warn); }
	#hint { position: fixed; right: 10px; bottom: 10px; padding: 6px 10px; font-size: 11px; color: var(--muted); }
	.lil-gui.root { position: fixed; top: 10px; right: 10px; max-height: calc(100% - 60px); overflow: auto; --width: 300px; }
	@media (max-width: 760px) {
		#refPanel { width: calc(100% - 40px); top: auto; bottom: 46px; max-height: 40%; }
		.lil-gui.root { --width: 240px; max-height: 45%; }
		#hint { display: none; }
	}
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="topbar" class="panel">
	<b>GeoBox Sky 天空編輯器</b>
	<span class="muted" id="projectLabel">—</span>
	<button id="btnPlay" title="Play / Pause (space)">⏸ 暫停</button>
	<span class="muted" id="timeLabel">t = 0 s</span>
	<button id="btnRefToggle" title="Show/hide reference panel">參考圖</button>
</div>

<div id="refPanel" class="panel">
	<h3>參考圖 → 自動生成雲彩 (Reference fit)</h3>
	<div id="drop">拖放天空照片到這裡，或點擊選擇<br><small>Drop a sky photo here / click to choose</small></div>
	<input type="file" id="file" accept="image/*" hidden>
	<div class="thumbs">
		<figure><canvas id="refCanvas" width="256" height="144"></canvas><figcaption>參考 Reference（藍線=地平線，紅=雲遮罩）</figcaption></figure>
		<figure><canvas id="renderCanvas" width="256" height="144"></canvas><figcaption>目前 Render (matched camera)</figcaption></figure>
	</div>
	<div class="row"><label>相機 FOV°</label><input type="range" id="fov" min="20" max="120" step="1" value="60"><span class="val" id="fovVal">60</span></div>
	<div class="row"><label>地平線 Horizon</label><input type="range" id="horizon" min="0" max="1" step="0.01" value="1" disabled><span class="val" id="horizonVal">auto</span></div>
	<div class="row"><label><input type="checkbox" id="horizonAuto" checked> auto</label><span class="muted">地平線位置（0=頂 1=底，1=沒有地面）</span></div>
	<div class="row"><label>雲閾值 Mask</label><input type="range" id="threshold" min="-0.6" max="0.2" step="0.01" value="-0.15" disabled><span class="val" id="thresholdVal">auto</span></div>
	<div class="row"><label><input type="checkbox" id="thresholdAuto" checked> auto</label><span class="muted">Otsu 自動，或手動調整遮罩</span></div>
	<div class="row"><label>相機方位 Yaw°</label><input type="number" id="camYaw" value="0" step="5"><span class="muted">照片朝向（0=北）</span></div>
	<div class="row"><label>精修次數</label><input type="number" id="iters" value="6" min="1" max="20"></div>
	<div class="btns">
		<button id="btnAnalyze" class="primary" disabled>① 分析並套用 Fit</button>
		<button id="btnRefine" disabled>② 精修 Refine</button>
		<button id="btnMask">遮罩 Mask</button>
	</div>
	<pre id="stats">尚未載入參考圖。</pre>
</div>

<div id="status" class="panel">載入中…</div>
<div id="hint" class="panel">拖曳旋轉視角 · 滾輪調 FOV · 空白鍵 播放/暫停</div>

<script type="module" src="./js/sky/skyEditor.js"></script>
</body>
</html>
